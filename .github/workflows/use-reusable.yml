name: Use Reusable Workflow
on: push

jobs:
  call-reusable:
    uses: George-Ogden/github-actions-katas/.github/workflows/reusable.yml@main
    with:
      numbers: "[1,2,3,4]"

  show-summary:
    needs: [call-reusable]
    runs-on: ubuntu-latest
    steps:
      - name: Print Output
        run: echo ${{ needs.call-reusable.outputs.summary }}
