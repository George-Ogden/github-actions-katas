name: Run Summary
on:
  workflow_dispatch:
    inputs:
      numbers:
        type: string

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Summarize
        uses: ./.github/actions/summary-action
        with:
          numbers: ${{ inputs.numbers }}

